services:
  api:
    build: .
    restart: unless-stopped
    command: uvicorn aeai_os.api.app:create_app --factory --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.example
    environment:
      AEAI_RUN_REPOSITORY_BACKEND: sqlalchemy
      AEAI_RUN_REPOSITORY_CREATE_SCHEMA: "true"
      AEAI_DATABASE_URL: postgresql+psycopg://aeai:aeai_password@postgres:5432/aeai_os
      AEAI_WORKFLOW_EXECUTION_MODE: async
      AEAI_PROCUREMENT_WORKFLOW_MAX_ATTEMPTS: "3"
      AEAI_WORKFLOW_QUEUE_BACKEND: redis
      AEAI_REDIS_URL: redis://redis:6379/0
      AEAI_LOCAL_SOURCE_CATALOG_PATH: artifacts/aeai-local-sources.json
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12

  risk-worker:
    build: .
    restart: unless-stopped
    command: python scripts/run_risk_worker.py --loop
    env_file:
      - .env.example
    environment:
      AEAI_LLM_ENABLED: "false"
      AEAI_RISK_DB_PATH: artifacts/aeai-risk-scans.db
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy

  workflow-worker:
    build: .
    restart: unless-stopped
    command: python scripts/managed_workflow_worker.py
    env_file:
      - .env.example
    environment:
      AEAI_RUN_REPOSITORY_BACKEND: sqlalchemy
      AEAI_RUN_REPOSITORY_CREATE_SCHEMA: "true"
      AEAI_DATABASE_URL: postgresql+psycopg://aeai:aeai_password@postgres:5432/aeai_os
      AEAI_WORKFLOW_EXECUTION_MODE: async
      AEAI_PROCUREMENT_WORKFLOW_MAX_ATTEMPTS: "3"
      AEAI_WORKFLOW_QUEUE_BACKEND: redis
      AEAI_REDIS_URL: redis://redis:6379/0
      AEAI_LOCAL_SOURCE_CATALOG_PATH: artifacts/aeai-local-sources.json
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  monitoring-worker:
    build: .
    restart: unless-stopped
    command: python -m aeai_os.monitoring.worker --loop
    env_file:
      - .env.example
    environment:
      AEAI_RUN_REPOSITORY_BACKEND: sqlalchemy
      AEAI_RUN_REPOSITORY_CREATE_SCHEMA: "true"
      AEAI_DATABASE_URL: postgresql+psycopg://aeai:aeai_password@postgres:5432/aeai_os
      AEAI_WORKFLOW_EXECUTION_MODE: async
      AEAI_MONITOR_DB_PATH: artifacts/aeai-monitoring.db
      AEAI_LOCAL_SOURCE_CATALOG_PATH: artifacts/aeai-local-sources.json
      AEAI_LLM_ENABLED: "false"
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeai_os
      POSTGRES_USER: aeai
      POSTGRES_PASSWORD: aeai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeai -d aeai_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aeai_minio
      MINIO_ROOT_PASSWORD: aeai_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.12
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aeai_grafana
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
